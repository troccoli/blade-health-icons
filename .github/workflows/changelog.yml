name: Generate Changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to add to the changelog (for example, v1.2.3)
        required: true
        type: string

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # Fetch all history and tags
          persist-credentials: false

      - name: Generate Changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --tag "${{ inputs.version }}"
        env:
          OUTPUT: CHANGELOG.md

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_committer_name: Giulio Troccoli-Allard
          git_committer_email: giulio@troccoli.it

      - name: Commit CHANGELOG.md
        env:
          CHANGELOG_PAT: ${{ secrets.CHANGELOG_PAT }}
        run: |
          git config user.name "Giulio Troccoli-Allard"
          git config user.email "giulio@troccoli.it"
          
          git add CHANGELOG.md
          git commit -S -m "chore(changelog): update CHANGELOG.md for ${{ inputs.version }}" || exit 0
          
          git remote set-url origin "https://x-access-token:${CHANGELOG_PAT}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main
