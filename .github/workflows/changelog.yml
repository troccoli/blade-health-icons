name: Generate Changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to add to the changelog (for example, v1.2.3)
        required: true
        type: string

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CHANGELOG_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # Fetch all history and tags
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Generate Changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --tag "${{ inputs.version }}"
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit CHANGELOG.md
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add CHANGELOG.md
          git commit -m "chore(changelog): update CHANGELOG.md for ${{ inputs.version }}" || exit 0
          
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main
